---
- name: Ensure OpenSSH server is installed and running
  ansible.builtin.apt:
    name: openssh-server
    state: present
- name: Refuse to disable password authentication without a separate verified key login
  ansible.builtin.assert:
    that: not (ssh_disable_password_authentication | bool)
    fail_msg: "Keep password SSH until a separate SSH-key login has been tested."
- name: Configure conservative SSH authentication settings
  ansible.builtin.template:
    src: 60-home-server.conf.j2
    dest: /etc/ssh/sshd_config.d/60-home-server.conf
    owner: root
    group: root
    mode: '0644'
    validate: /usr/sbin/sshd -t -f %s
  notify: Validate SSH configuration
- name: Install Fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present
- name: Configure Fail2ban SSH jail
  ansible.builtin.template:
    src: sshd.local.j2
    dest: /etc/fail2ban/jail.d/sshd.local
    owner: root
    group: root
    mode: '0644'
  notify: Restart Fail2ban
- name: Enable Fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
- name: Allow SSH on Tailscale before enabling UFW
  community.general.ufw:
    rule: allow
    interface: "{{ tailscale_interface }}"
    direction: in
    to_port: '22'
    proto: tcp
- name: Set outgoing firewall policy
  community.general.ufw:
    direction: outgoing
    policy: allow
- name: Set incoming firewall policy
  community.general.ufw:
    direction: incoming
    policy: deny
- name: Enable UFW after allowing management access
  community.general.ufw:
    state: enabled
  when: ufw_enable | bool
